server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # add_header in a location block discards headers inherited from the server
    # block, so the shared security headers are included in every location.
    include /etc/nginx/security-headers.inc;

    # Keep the backend private; browser API requests enter through this app.
    location ^~ /api/ {
        include /etc/nginx/security-headers.inc;
        proxy_pass ${BACKEND_URL};
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_buffering off;
    }

    # Hashed build assets can be cached indefinitely.
    location /assets/ {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Never cache the entry point, so a new deployment is picked up immediately.
    location = /index.html {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-store";
    }

    # Single-page-app fallback (same behaviour as the Vercel rewrite).
    location / {
        include /etc/nginx/security-headers.inc;
        try_files $uri $uri/ /index.html;
    }
}
