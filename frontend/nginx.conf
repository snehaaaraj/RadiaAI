server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # add_header in a location block discards headers inherited from the server
    # block, so the shared security headers are included in every location.
    include /etc/nginx/security-headers.inc;

    # Hashed build assets can be cached indefinitely.
    location /assets/ {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Never cache the entry point, so a new deployment is picked up immediately.
    location = /index.html {
        include /etc/nginx/security-headers.inc;
        add_header Cache-Control "no-store";
    }

    # Single-page-app fallback (same behaviour as the Vercel rewrite).
    location / {
        include /etc/nginx/security-headers.inc;
        try_files $uri $uri/ /index.html;
    }
}
