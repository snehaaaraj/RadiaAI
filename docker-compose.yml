# ---------------------------------------------------------------------------
# Radia AI — Docker Compose
#
# Usage:
#   cp .env.example .env      # fill in your Azure credentials
#   docker compose up --build
#
# Services:
#   backend   FastAPI on :8000
#   frontend  React + nginx on :3000 (proxies /api to backend)
# ---------------------------------------------------------------------------

name: radia-ai

services:
  # ---------------------------------------------------------------------------
  # FastAPI backend
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    image: radia-ai-backend:local
    container_name: radia-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # These override .env to ensure correct container-level values
      ENVIRONMENT: local
      LOG_LEVEL: DEBUG
    volumes:
      # Mount source for live reload in development — remove in production
      - ./backend/app:/app/app:ro
      - ./documents:/app/documents:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - radia-network

  # ---------------------------------------------------------------------------
  # React frontend (Vite dev server in development, nginx in production)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: radia-ai-frontend:local
    container_name: radia-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - radia-network

networks:
  radia-network:
    driver: bridge
