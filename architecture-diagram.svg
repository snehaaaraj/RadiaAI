<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Radia AI Architecture Diagram</title>
  <desc id="desc">Frontend, delivery, backend, and Azure services architecture diagram.</desc>
  <defs>
    <style>
      .bg { fill: #0b1220; }
      .panel { fill: #111827; stroke: #334155; stroke-width: 2; rx: 18; ry: 18; }
      .groupTitle { fill: #e2e8f0; font: 700 22px Arial, sans-serif; }
      .node { fill: #1f2937; stroke: #64748b; stroke-width: 2; rx: 14; ry: 14; }
      .nodeAzure { fill: #0f766e; stroke: #5eead4; stroke-width: 2; rx: 14; ry: 14; }
      .nodeText { fill: #f8fafc; font: 600 18px Arial, sans-serif; }
      .smallText { fill: #cbd5e1; font: 14px Arial, sans-serif; }
      .arrow { stroke: #94a3b8; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .arrowAzure { stroke: #5eead4; stroke-width: 3; fill: none; marker-end: url(#arrowheadAzure); }
      .label { fill: #cbd5e1; font: 16px Arial, sans-serif; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#94a3b8" />
    </marker>
    <marker id="arrowheadAzure" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 Z" fill="#5eead4" />
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1400" height="900" />

  <!-- Frontend -->
  <rect class="panel" x="40" y="60" width="420" height="280" />
  <text class="groupTitle" x="60" y="95">Frontend — React + TypeScript + Vite</text>
  <rect class="node" x="80" y="125" width="160" height="56" />
  <text class="nodeText" x="160" y="160" text-anchor="middle">Landing</text>
  <rect class="node" x="260" y="125" width="160" height="56" />
  <text class="nodeText" x="340" y="160" text-anchor="middle">Resources</text>
  <rect class="node" x="170" y="215" width="200" height="56" />
  <text class="nodeText" x="270" y="250" text-anchor="middle">Workspace UI</text>
  <text class="smallText" x="60" y="305">Pages • Components • Hooks • Context • Typed API client</text>

  <!-- Delivery -->
  <rect class="panel" x="520" y="70" width="360" height="180" />
  <text class="groupTitle" x="540" y="105">Delivery</text>
  <rect class="node" x="620" y="130" width="160" height="56" />
  <text class="nodeText" x="700" y="165" text-anchor="middle">Nginx / Docker</text>

  <!-- Backend -->
  <rect class="panel" x="40" y="400" width="860" height="390" />
  <text class="groupTitle" x="60" y="435">Backend — FastAPI + Python 3.12</text>

  <rect class="node" x="80" y="470" width="170" height="56" />
  <text class="nodeText" x="165" y="505" text-anchor="middle">API v1 routes</text>
  <rect class="node" x="280" y="470" width="170" height="56" />
  <text class="nodeText" x="365" y="505" text-anchor="middle">Services</text>
  <rect class="node" x="480" y="470" width="170" height="56" />
  <text class="nodeText" x="565" y="505" text-anchor="middle">Reviewers</text>
  <rect class="node" x="680" y="470" width="170" height="56" />
  <text class="nodeText" x="765" y="505" text-anchor="middle">Rules + Diff</text>

  <rect class="node" x="80" y="565" width="170" height="56" />
  <text class="nodeText" x="165" y="600" text-anchor="middle">Schemas</text>
  <rect class="node" x="280" y="565" width="170" height="56" />
  <text class="nodeText" x="365" y="600" text-anchor="middle">Repositories</text>
  <rect class="node" x="480" y="565" width="170" height="56" />
  <text class="nodeText" x="565" y="600" text-anchor="middle">Standards</text>
  <rect class="node" x="680" y="565" width="170" height="56" />
  <text class="nodeText" x="765" y="600" text-anchor="middle">Core / DI</text>

  <rect class="node" x="170" y="660" width="250" height="56" />
  <text class="nodeText" x="295" y="695" text-anchor="middle">Ingestion + Connectors</text>
  <rect class="node" x="460" y="660" width="250" height="56" />
  <text class="nodeText" x="585" y="695" text-anchor="middle">Legacy RAG / Search / Chat</text>

  <!-- Azure -->
  <rect class="panel" x="980" y="470" width="360" height="250" />
  <text class="groupTitle" x="1000" y="505">Azure Services</text>
  <rect class="nodeAzure" x="1030" y="540" width="240" height="56" />
  <text class="nodeText" x="1150" y="575" text-anchor="middle">Azure OpenAI</text>
  <rect class="nodeAzure" x="1030" y="615" width="240" height="56" />
  <text class="nodeText" x="1150" y="650" text-anchor="middle">Azure AI Search</text>
  <rect class="nodeAzure" x="1030" y="690" width="240" height="56" />
  <text class="nodeText" x="1150" y="725" text-anchor="middle">Azure Blob Storage</text>

  <!-- Edges -->
  <path class="arrow" d="M460 200 L620 158" />
  <text class="label" x="525" y="165">/api/v1/*</text>
  <path class="arrow" d="M780 158 L860 158 L860 240 L460 240" />
  <text class="label" x="785" y="132">HTTP</text>

  <path class="arrow" d="M700 186 L700 400" />
  <path class="arrow" d="M700 188 L700 470" />
  <path class="arrow" d="M165 526 L365 526" />
  <path class="arrow" d="M365 526 L565 526" />
  <path class="arrow" d="M565 526 L765 526" />
  <path class="arrow" d="M165 621 L365 621" />
  <path class="arrow" d="M365 621 L565 621" />
  <path class="arrow" d="M565 621 L765 621" />
  <path class="arrow" d="M295 716 L295 760 L585 760 L585 716" />

  <path class="arrowAzure" d="M850 526 L980 526" />
  <path class="arrowAzure" d="M850 690 L980 690" />
  <path class="arrowAzure" d="M650 716 L980 716" />

  <text class="smallText" x="1010" y="775">Frontend served through Nginx/Docker; backend orchestrates deterministic review workflows.</text>
</svg>
