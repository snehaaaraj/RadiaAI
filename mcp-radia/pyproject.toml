[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-radia"
version = "0.1.0"
description = "RadiaAI digital-thread MCP server (Jira, Confluence, Jama, Genesys)"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.2.0,<3",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "structlog>=24.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "ruff>=0.8.4",
    "mypy>=1.13",
]

[project.scripts]
mcp-radia = "mcp_radia.cli:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["mcp_radia*"]

# ---------------------------------------------------------------------------
# Ruff - linter + formatter. Mirrors backend/pyproject.toml so both trees are
# held to the same style, minus the backend-specific per-file ignores.
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["mcp_radia", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "ANN", # flake8-annotations
    "S",   # flake8-bandit
    "RUF", # Ruff-specific rules
]
ignore = [
    "S101", # use of assert (allowed in tests)
    "E501", # line too long - handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ANN"]

[tool.ruff.lint.isort]
known-first-party = ["mcp_radia"]

[tool.ruff.format]
line-ending = "lf"

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: unit tests (no external dependencies, no network)",
    "integration: integration tests (require real system credentials)",
]

[tool.coverage.run]
source = ["mcp_radia"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
