[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radia-ai-backend"
version = "0.1.0"
description = "Radia AI — Enterprise RAG Platform Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.32.1",
    "python-multipart==0.0.20",
    "pydantic==2.10.3",
    "pydantic-settings==2.7.0",
    "azure-identity==1.19.0",
    "azure-search-documents==11.6.0b8",
    "azure-storage-blob==12.24.0",
    "openai==1.58.1",
    "httpx==0.28.1",
    "PyMuPDF==1.25.1",
    "python-docx==1.1.2",
    "python-jose[cryptography]==3.3.0",
    "tenacity==9.0.0",
    "structlog==24.4.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "radia_ai*"]

# ---------------------------------------------------------------------------
# Ruff — linter + formatter (replaces flake8 + isort + pyupgrade)
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "radia_ai", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "ANN", # flake8-annotations (type hints)
    "S",   # flake8-bandit (security)
    "RUF", # Ruff-specific rules
]
ignore = [
    "S101",   # use of assert (allowed in tests)
    "B008",   # FastAPI Depends/File in argument defaults — idiomatic pattern
    "E501",   # line too long — handled by formatter
    "TC001",  # TODO: move app imports into TYPE_CHECKING blocks
    "RUF012", # TODO: annotate mutable class attributes with ClassVar
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ANN"]

[tool.ruff.lint.isort]
known-first-party = ["app", "radia_ai"]

# ---------------------------------------------------------------------------
# Black — code formatter
# ---------------------------------------------------------------------------
[tool.black]
line-length = 100
target-version = ["py312"]

# ---------------------------------------------------------------------------
# mypy — static type checker
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short --strict-markers"
markers = [
    "unit: unit tests (no external dependencies)",
    "integration: integration tests (require Azure services)",
]

[tool.coverage.run]
source = ["app"]
omit = ["tests/*", "app/main.py"]

[tool.coverage.report]
fail_under = 45
show_missing = true
